server:
  port: ${SERVER_PORT:1337}

spring:
  application:
    name: msgsim
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/bimd_template}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  security:
    jwt-secret: ${JWT_SECRET:change-me}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  initial-user:
    email: ${INITIAL_USER_EMAIL:admin@oaksd.local}
    password: ${INITIAL_USER_PASSWORD:ChangeMe123!}
    name: ${INITIAL_USER_NAME:Administrador}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:bimd-template}
    access-key-id: ${S3_ACCESS_KEY_ID:minioadmin}
    secret-access-key: ${S3_SECRET_ACCESS_KEY:minioadmin}
    force-path-style: ${S3_FORCE_PATH_STYLE:true}
    presigned-url-expires-in: ${S3_PRESIGNED_URL_EXPIRES_IN:900}
  email:
    enabled: ${EMAIL_ENABLED:true}
    from: ${EMAIL_FROM:no-reply@oaksd.local}
