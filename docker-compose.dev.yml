services:
  postgres:
    image: postgres:16-alpine
    container_name: msgsim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bimd_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: msgsim-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: msgsim-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Fase 8: broker real para o modo execution=REAL (só RabbitMQ implementado —
  # ver ARCHITECTURE.md e ADR 0006 para o porquê de Kafka/SQS ficarem de fora).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: msgsim-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres-data:
  minio-data:
